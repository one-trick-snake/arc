<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aspect Ratio Calculator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{--bg:#e7ebed;--panel:#f6f8f9;--ink:#14212b;--mute:#5b6b76;--line:#c3ccd2;--acc:#0b7a7d;--acc-ink:#fff;--bar:#14212b;--fill:#0b7a7d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f171d;--panel:#18232b;--ink:#e6edf1;--mute:#93a4af;--line:#2d3d48;--acc:#3cc3c6;--acc-ink:#07181a;--bar:#050a0d;--fill:#3cc3c6}}
:root[data-theme="dark"]{--bg:#0f171d;--panel:#18232b;--ink:#e6edf1;--mute:#93a4af;--line:#2d3d48;--acc:#3cc3c6;--acc-ink:#07181a;--bar:#050a0d;--fill:#3cc3c6}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1060px;margin:0 auto;padding:24px 16px 40px;display:grid;gap:20px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media(max-width:820px){main{grid-template-columns:1fr}}
h1{grid-column:1/-1;margin:0;font-size:26px;font-weight:600;letter-spacing:-.01em}
h1 small{display:block;font-size:14px;font-weight:400;color:var(--mute);margin-top:2px}
h2{margin:0 0 10px;font-size:16px;font-weight:600}
section{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:16px}
.col{min-width:0}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.presets button{font:inherit;text-align:left;padding:8px 10px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:4px;cursor:pointer}
.presets button b{display:block;font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:500;font-size:14px}
.presets button span{display:block;font-size:12px;color:var(--mute);line-height:1.3}
.presets button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.presets button[aria-pressed="true"] span{color:inherit;opacity:.85}
.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-top:12px}
label{display:block;font-size:13px;color:var(--mute)}
input[type=number]{display:block;width:110px;margin-top:3px;font:500 15px "IBM Plex Mono",ui-monospace,monospace;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:7px 8px}
input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.sep{padding-bottom:8px;color:var(--mute)}
.chk{display:flex;gap:6px;align-items:center;margin-top:12px;color:var(--ink);font-size:14px}
.note{margin:10px 0 0;font-size:13px;color:var(--mute)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chips button{font:500 13px "IBM Plex Mono",ui-monospace,monospace;padding:4px 8px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:4px;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--mute);font-size:13px}
td.m{font-family:"IBM Plex Mono",ui-monospace,monospace}
.sticky{position:sticky;top:calc(12px + env(safe-area-inset-top,0px))}
svg{display:block;width:100%;height:auto;max-height:360px;border:1px solid var(--line);border-radius:4px;background:var(--bg)}
.big{font:500 22px "IBM Plex Mono",ui-monospace,monospace;margin:12px 0 0}
.big small{font:400 14px "IBM Plex Sans",system-ui,sans-serif;color:var(--mute);margin-left:8px}
.legend{display:flex;gap:14px;font-size:13px;color:var(--mute);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;vertical-align:-1px;margin-right:5px;border-radius:2px}
</style>
</head>
<body>
<main>
<h1>Aspect ratio calculator<small>Pick a ratio, then size it from one dimension or fit it into a frame.</small></h1>

<div class="col">
  <section>
    <h2>Ratio</h2>
    <div class="presets" id="presets"></div>
    <div class="row">
      <label>Width<input type="number" id="rw" min="0.01" step="any" value="16"></label>
      <span class="sep">:</span>
      <label>Height<input type="number" id="rh" min="0.01" step="any" value="9"></label>
    </div>
    <p class="note" id="ratioInfo"></p>
  </section>

  <section>
    <h2>Size from one dimension</h2>
    <div class="row">
      <label>Width (px)<input type="number" id="sw" min="1" step="1" value="1920"></label>
      <span class="sep">×</span>
      <label>Height (px)<input type="number" id="sh" min="1" step="1" value="1080"></label>
    </div>
    <label class="chk"><input type="checkbox" id="even" checked> Round to even numbers (safer for H.264 and H.265)</label>
    <p class="note" id="scaleInfo"></p>
    <div class="chips" id="widthChips"></div>
  </section>
</div>

<div class="col">
  <section class="sticky">
    <h2>Fit into a frame</h2>
    <div class="row" style="margin-top:0">
      <label>Frame width<input type="number" id="cw" min="1" step="1" value="1920"></label>
      <span class="sep">×</span>
      <label>Frame height<input type="number" id="ch" min="1" step="1" value="1080"></label>
    </div>
    <div class="chips" id="frameChips"></div>
    <svg id="preview" viewBox="0 0 1920 1080" role="img" aria-label="Preview of the ratio inside the frame"></svg>
    <div class="legend"><span><i style="background:var(--bar)"></i>Bars (fit)</span><span><i style="background:var(--fill);opacity:.5"></i>Image</span><span><i style="border:1.5px dashed var(--fill)"></i>Fill (cropped)</span></div>
    <table>
      <thead><tr><th>Mode</th><th>Image size</th><th>Result</th></tr></thead>
      <tbody id="fitRows"></tbody>
    </table>
  </section>
</div>
</main>

<script>
const PRESETS=[
 ["16:9",16,9,"HD, UHD, YouTube"],["9:16",9,16,"Reels, Shorts, TikTok"],["1:1",1,1,"Square feed"],
 ["4:5",4,5,"Instagram portrait"],["4:3",4,3,"Classic TV"],["3:2",3,2,"35mm stills"],
 ["17:9",17,9,"DCI 2K and 4K"],["2:1",2,1,"Univisium"],["2.39:1",2.39,1,"Anamorphic scope"],
 ["2.35:1",2.35,1,"Older scope"],["1.85:1",1.85,1,"Theatrical flat"],["1.43:1",1.43,1,"IMAX 70mm"]
];
const FRAMES=[["HD",1920,1080],["UHD",3840,2160],["DCI 4K",4096,2160],["Vertical HD",1080,1920],["Square",1080,1080]];
const WIDTHS=[1280,1920,2048,2560,3840,4096];
const $=id=>document.getElementById(id);
let rw=16,rh=9,last="w";

const gcd=(a,b)=>b?gcd(b,a%b):a;
const fmt=n=>Number.isInteger(n)?String(n):String(+n.toFixed(2));
const even=()=>$("even").checked;
const snap=n=>even()?Math.max(2,Math.round(n/2)*2):Math.max(1,Math.round(n));

function renderPresets(){
  const box=$("presets");box.innerHTML="";
  PRESETS.forEach(([n,w,h,d])=>{
    const b=document.createElement("button");b.type="button";
    b.setAttribute("aria-pressed",Math.abs(w/h-rw/rh)<1e-6);
    b.innerHTML="<b>"+n+"</b><span>"+d+"</span>";
    b.onclick=()=>{rw=w;rh=h;$("rw").value=w;$("rh").value=h;update()};
    box.appendChild(b);
  });
}
function chips(id,list,fn){
  const box=$(id);box.innerHTML="";
  list.forEach(item=>{const b=document.createElement("button");b.type="button";b.textContent=item[0];b.onclick=()=>fn(item);box.appendChild(b)});
}
function ratioText(){
  const dec=rw/rh;
  let s=fmt(dec)+":1 decimal";
  if(Number.isInteger(rw)&&Number.isInteger(rh)){const g=gcd(rw,rh);s="Simplified "+rw/g+":"+rh/g+" · "+s}
  return s;
}
function scale(){
  let msg;
  if(last==="w"){
    const w=+$("sw").value||0,exact=w*rh/rw,h=snap(exact);
    $("sh").value=h;
    msg="Exact height "+exact.toFixed(2)+" px, using "+h+" px.";
    const err=Math.abs(w/h-rw/rh)/(rw/rh)*100;
    if(err>0.005)msg+=" Ratio off by "+err.toFixed(3)+"%.";
  }else{
    const h=+$("sh").value||0,exact=h*rw/rh,w=snap(exact);
    $("sw").value=w;
    msg="Exact width "+exact.toFixed(2)+" px, using "+w+" px.";
    const err=Math.abs(w/h-rw/rh)/(rw/rh)*100;
    if(err>0.005)msg+=" Ratio off by "+err.toFixed(3)+"%.";
  }
  $("scaleInfo").textContent=msg;
}
function fit(){
  const cw=+$("cw").value||1,ch=+$("ch").value||1,r=rw/rh;
  const fs=Math.min(cw/rw,ch/rh),fW=rw*fs,fH=rh*fs;
  const ls=Math.max(cw/rw,ch/rh),lW=rw*ls,lH=rh*ls;
  const barX=(cw-fW)/2,barY=(ch-fH)/2;
  const svg=$("preview");
  svg.setAttribute("viewBox","0 0 "+cw+" "+ch);
  const sw=Math.max(cw,ch)/300;
  svg.innerHTML=
   '<rect width="'+cw+'" height="'+ch+'" fill="var(--bar)"/>'+
   '<rect x="'+barX+'" y="'+barY+'" width="'+fW+'" height="'+fH+'" fill="var(--fill)" fill-opacity=".5"/>'+
   '<rect x="'+(cw-lW)/2+'" y="'+(ch-lH)/2+'" width="'+lW+'" height="'+lH+'" fill="none" stroke="var(--fill)" stroke-width="'+sw+'" stroke-dasharray="'+sw*4+' '+sw*3+'"/>';
  const bars=barX>0.5?[Math.round(barX)+" px each side (pillarbox)"]:barY>0.5?[Math.round(barY)+" px top and bottom (letterbox)"]:["No bars, exact match"];
  const crop=lW-cw>0.5?Math.round((lW-cw)/2)+" px cropped each side":lH-ch>0.5?Math.round((lH-ch)/2)+" px cropped top and bottom":"No crop, exact match";
  $("fitRows").innerHTML=
   "<tr><td>Fit</td><td class='m'>"+Math.round(fW)+" × "+Math.round(fH)+"</td><td>"+bars[0]+"</td></tr>"+
   "<tr><td>Fill</td><td class='m'>"+Math.round(lW)+" × "+Math.round(lH)+"</td><td>"+crop+"</td></tr>";
}
function update(){
  $("ratioInfo").textContent=ratioText();
  renderPresets();scale();fit();
}
function readRatio(){
  const w=+$("rw").value,h=+$("rh").value;
  if(w>0&&h>0){rw=w;rh=h;update()}
}
$("rw").oninput=readRatio;$("rh").oninput=readRatio;
$("sw").oninput=()=>{last="w";scale()};
$("sh").oninput=()=>{last="h";scale()};
$("even").onchange=scale;
$("cw").oninput=fit;$("ch").oninput=fit;
chips("widthChips",WIDTHS.map(w=>[String(w)+" wide",w]),i=>{$("sw").value=i[1];last="w";scale()});
chips("frameChips",FRAMES.map(f=>[f[0]+" "+f[1]+"×"+f[2],f[1],f[2]]),i=>{$("cw").value=i[1];$("ch").value=i[2];fit()});
update();
</script>
</body>
</html>
